name: Publish AUR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    environment: aur
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git openssh curl jq pacman-contrib

      - name: Configure builder and AUR key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          useradd -m builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan aur.archlinux.org > /home/builder/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > /home/builder/.ssh/config
          chown builder:builder /home/builder/.ssh/aur /home/builder/.ssh/known_hosts /home/builder/.ssh/config

      - name: Determine latest version tag
        id: tag
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/${GITHUB_REPOSITORY}.git" | grep 'refs/tags/v' | head -n1 | sed 's#.*refs/tags/##')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bump pkgver, update checksums and .SRCINFO, push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          appimage_sha=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r 'first(.assets[] | select(.name == "AutoSubSync-linux-amd64.AppImage") | .digest)' \
            | sed 's/^sha256://')
          if ! printf '%s' "$appimage_sha" | grep -Eq '^[0-9a-f]{64}$'; then
            appimage_sha=""
          fi

          cat > /tmp/push.sh <<'EOF'
          set -euo pipefail
          version="$1"
          appimage_sha="$2"
          git clone ssh://aur@aur.archlinux.org/autosubsync-bin.git aur
          cd aur
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD
          if [ -n "$appimage_sha" ]; then
            desktop_sha=$(sha256sum autosubsync.desktop | awk '{print $1}')
            sha_line=$(grep -n '^sha256sums=(' PKGBUILD | cut -d: -f1)
            test "$(sed -n '/^sha256sums=(/,/^)/p' PKGBUILD | grep -c "^  '")" -eq 2
            sed -i "$((sha_line+1))s/.*/  '${appimage_sha}'/" PKGBUILD
            sed -i "$((sha_line+2))s/.*/  '${desktop_sha}'/" PKGBUILD
          else
            updpkgsums
          fi
          makepkg --printsrcinfo > .SRCINFO
          git config user.name "denizsafak"
          git config user.email "denizsafak98@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "v${version}"
          git push origin master
          EOF
          chown builder:builder /tmp/push.sh
          su - builder -c "bash /tmp/push.sh '${version}' '${appimage_sha}'"
