version: '3.8'

services:
  autosubsync:
    build: .
    container_name: autosubsync
    ports:
      - "6080:6080"  # Web VNC interface
      - "5900:5900"  # VNC port (optional)
    volumes:
      - $PWD/input:/app/input       # Mount for input files
      - ./output:/app/output     # Mount for output files
      - $PWD/desktop:/home/autosubsync/Desktop  # Desktop directory
    environment:
      - DISPLAY=:0
      - QT_QPA_PLATFORM=xcb
    restart: unless-stopped

  # Headless CLI image for autonomous pipelines.
  # Build:  docker compose build assy-cli
  # Usage:  docker compose run --rm assy-cli sync /data/video.mkv /data/sub.srt
  assy-cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    image: autosubsync-cli
    volumes:
      - $PWD:/data
    profiles: ["cli"]   # only spun up when explicitly invoked
